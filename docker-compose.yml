services:
  api:
    build: .
    image: bank-marketing-prediction:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${HOST_API_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  predict-app:
    build: .
    image: bank-marketing-prediction:latest
    command: streamlit run apps/predict_app/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${HOST_PREDICT_PORT:-8501}:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build: .
    image: bank-marketing-prediction:latest
    command: streamlit run apps/dashboard/app.py --server.port 8502 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${HOST_DASHBOARD_PORT:-8502}:8502"
    depends_on:
      - api
